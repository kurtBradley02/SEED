name: 04 DB Pipeline

on:
  workflow_dispatch:

jobs:
  db-setup:
    uses: ./.github/workflows/db_setup.yml
    secrets: inherit

  db-build:
    needs: db-setup
    uses: ./.github/workflows/db_build.yml
    secrets: inherit

  db-test:
    needs: db-build
    uses: ./.github/workflows/db_test.yml
    secrets: inherit