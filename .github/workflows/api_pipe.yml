name: API Pipe

on:
  workflow_dispatch:
  workflow_call:

jobs:
  api-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: ./02_API
        run: chmod +x mvnw

      - name: Run API tests
        working-directory: ./02_API
        run: ./mvnw -B test